spring:
  datasource:
    url: jdbc:h2:mem:cinemanest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  sql:
    init:
      mode: never

app:
  init-admin:
    enabled: false
  swagger:
    auto-open: false
